<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>칸반 보드</title>
  <!-- Roboto(Material 기본 글꼴). 인터넷이 없으면 시스템 글꼴로 보인다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- 일반 스크립트 + defer(HTML을 다 읽은 뒤 적힌 순서대로 실행).
       config.js(접속 정보) → supabase-js(로그인·DB, 버전 고정 + 변조 방지 해시) → kanban.js(순수 로직) → store.js(저장소) → app.js(화면) -->
  <script src="config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous" defer></script>
  <script src="kanban.js" defer></script>
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- 아이콘은 Material Icons(Apache 2.0) 경로를 SVG로 직접 넣는다. 글꼴 아이콘과 달리 인터넷 없이도 보인다 -->
  <header class="app-bar">
    <div class="app-bar-inner">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5H3c-.55 0-1 .45-1 1v12c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V6c0-.55-.45-1-1-1zm14 0h-3c-.55 0-1 .45-1 1v12c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V6c0-.55-.45-1-1-1zm-7 0h-3c-.55 0-1 .45-1 1v12c0 .55.45 1 1 1h3c.55 0 1-.45 1-1V6c0-.55-.45-1-1-1z"/></svg>
      <h1 class="app-bar-title">칸반 보드</h1>
      <div class="user-menu" hidden>
        <span class="user-email"></span>
        <button type="button" class="text-button sign-out">로그아웃</button>
      </div>
    </div>
  </header>

  <!-- 로그인 화면: 로그인 전에만 보인다(app.js가 hidden을 바꾼다) -->
  <section class="login" hidden>
    <div class="login-panel">
      <h2 class="login-title">로그인</h2>
      <p class="login-help">카드는 내 계정에만 저장되고, 다른 사람에게는 보이지 않습니다.</p>
      <button type="button" class="outlined-button provider-button" data-provider="google">
        <svg class="provider-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Google로 계속하기</span>
      </button>
      <button type="button" class="outlined-button provider-button" data-provider="github">
        <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.02-2.04-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.4s2.04.13 3 .4c2.28-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.82 1.1.82 2.22 0 1.6-.02 2.9-.02 3.29 0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
        <span>GitHub로 계속하기</span>
      </button>
      <div class="divider"><span>또는 이메일</span></div>
      <form class="email-form" novalidate>
        <label class="field">
          <span class="field-label">이메일</span>
          <input type="email" name="email" autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">비밀번호(6자 이상)</span>
          <input type="password" name="password" autocomplete="current-password">
        </label>
        <div class="email-actions">
          <button type="submit" class="filled-button" data-action="sign-in">로그인</button>
          <button type="button" class="outlined-button" data-action="sign-up">회원가입</button>
        </div>
      </form>
      <p class="login-message" role="alert" hidden></p>
    </div>
  </section>

  <main class="board" hidden>
    <section class="column" data-status="todo">
      <header class="column-header">
        <h2 class="column-title">To-Do</h2>
        <span class="count" data-count="todo">0</span>
      </header>
      <ul class="card-list" data-list="todo"></ul>
      <form class="add-form" data-status="todo">
        <input type="text" name="title" maxlength="200" placeholder="새 카드" aria-label="To-Do에 추가할 카드 제목" autocomplete="off">
        <button type="submit" class="filled-button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>추가</span>
        </button>
      </form>
    </section>

    <section class="column" data-status="doing">
      <header class="column-header">
        <h2 class="column-title">In Progress</h2>
        <span class="count" data-count="doing">0</span>
      </header>
      <ul class="card-list" data-list="doing"></ul>
      <form class="add-form" data-status="doing">
        <input type="text" name="title" maxlength="200" placeholder="새 카드" aria-label="In Progress에 추가할 카드 제목" autocomplete="off">
        <button type="submit" class="filled-button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>추가</span>
        </button>
      </form>
    </section>

    <section class="column" data-status="done">
      <header class="column-header">
        <h2 class="column-title">Done</h2>
        <span class="count" data-count="done">0</span>
      </header>
      <ul class="card-list" data-list="done"></ul>
      <form class="add-form" data-status="done">
        <input type="text" name="title" maxlength="200" placeholder="새 카드" aria-label="Done에 추가할 카드 제목" autocomplete="off">
        <button type="submit" class="filled-button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>추가</span>
        </button>
      </form>
    </section>
  </main>

  <!-- 저장 실패 등 잠깐 보이는 안내 -->
  <div class="snackbar" role="status" aria-live="polite" hidden></div>
</body>
</html>
